name: Apply homepage refresh
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Attach homepage refresh only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          locked='/assets/omni-terrain-approved-gt.webp?v=1'
          if locked not in s:
              raise SystemExit('LOCKED LOGO REFERENCE MISSING — refusing homepage refresh')
          css='<link rel="stylesheet" href="assets/homepage-refresh.css?v=1">'
          js='<script defer src="assets/homepage-refresh.js?v=1"></script>'
          if css not in s:
              s=s.replace('</head>',css+'</head>',1)
          if js not in s:
              s=s.replace('</body>',js+'</body>',1)
          if locked not in s:
              raise SystemExit('LOCKED LOGO CHANGED — aborting')
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/apply-homepage-refresh.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/apply-homepage-refresh.yml
          git commit -m 'Apply clean homepage refresh'
          git push
