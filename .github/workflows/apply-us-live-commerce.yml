name: Apply Omni Terrain US live-commerce hooks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-us-live-commerce.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep Wave 1 validator scoped to manifest products
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('scripts/test-wave1-storefront.py')
          text = path.read_text(encoding='utf-8')
          pattern = r'actual_pages\s*=\s*\{\s*p\.name for p in ROOT\.glob\("us-\*\.html"\)\s*if p\.name != "us-catalogue\.html"\s*\}'
          replacement = 'manifest_page_names = set(slugs)\n\nactual_pages = {p.name for p in ROOT.glob("us-*.html") if p.name in manifest_page_names}'
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1 and 'manifest_page_names = set(slugs)' not in text:
              raise SystemExit('Could not patch Wave 1 product-page scope')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply customer-facing retail copy
        run: python scripts/keystone-retailize-storefront.py --root .

      - name: Inject live-commerce runtime
        run: python scripts/inject-us-live-commerce.py --root .

      - name: Validate Wave 1 storefront
        run: python scripts/test-wave1-storefront.py

      - name: Commit storefront updates
        run: |
          if git diff --quiet; then
            echo "No storefront changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test-wave1-storefront.py -- '*.html'
          git commit -m "Retailize Wave 1 and attach verified US commerce runtime"
          git push origin HEAD:main
