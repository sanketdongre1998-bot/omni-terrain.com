name: Apply shared US shell and premium catalogue

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-us-shell-and-catalogue.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Attach shared shell and catalogue presentation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          shell_tag = '<script defer src="assets/us-shell.js?v=5"></script>'
          performance_tag = '<script defer src="assets/storefront-performance.js?v=3"></script>'
          theme_tag = '<script defer src="assets/theme-toggle.js?v=2"></script>'
          catalogue_tag = '<script defer src="assets/catalogue-premium.js?v=2"></script>'
          changed = 0
          shell_count = 0

          for path in root.glob('*.html'):
              text = path.read_text(encoding='utf-8', errors='replace')
              lower = text.lower()
              if '<body' not in lower or '</body>' not in lower:
                  continue
              if re.search(r'<html[^>]+lang=["\']en-gb["\']', text, flags=re.I):
                  continue

              original = text

              # Every US page gets a fresh performance runtime URL so browser caches
              # cannot retain the old logo/render behavior.
              if 'assets/storefront-performance.js' in text:
                  text = re.sub(r'<script\s+defer\s+src=["\']assets/storefront-performance\.js(?:\?v=[^"\']+)?["\']></script>', performance_tag, text, flags=re.I)
              else:
                  text = text.replace('</body>', performance_tag + '</body>', 1)

              if 'assets/theme-toggle.js' in text:
                  text = re.sub(r'<script\s+defer\s+src=["\']assets/theme-toggle\.js(?:\?v=[^"\']+)?["\']></script>', theme_tag, text, flags=re.I)

              if path.name != 'index.html':
                  if 'assets/us-shell.js' in text:
                      text = re.sub(r'<script\s+defer\s+src=["\']assets/us-shell\.js(?:\?v=[^"\']+)?["\']></script>', shell_tag, text, flags=re.I)
                  else:
                      text = text.replace('</body>', shell_tag + '</body>', 1)
                      shell_count += 1

              if path.name == 'us-catalogue.html':
                  if 'assets/catalogue-premium.js' in text:
                      text = re.sub(r'<script\s+defer\s+src=["\']assets/catalogue-premium\.js(?:\?v=[^"\']+)?["\']></script>', catalogue_tag, text, flags=re.I)
                  else:
                      text = text.replace('</body>', catalogue_tag + '</body>', 1)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed += 1

          shell = Path('assets/us-shell.js')
          shell_text = shell.read_text(encoding='utf-8')
          new_shell = shell_text.replace('/assets/universal-checkout-ui.js?v=1', '/assets/universal-checkout-ui.js?v=2').replace('/assets/cart-checkout-premium.js?v=2', '/assets/cart-checkout-premium.js?v=3').replace('/assets/product-page-premium.js?v=2', '/assets/product-page-premium.js?v=3')
          if new_shell != shell_text:
              shell.write_text(new_shell, encoding='utf-8')

          home = Path('index.html')
          home_text = home.read_text(encoding='utf-8', errors='replace')
          polished_home = home_text
          replacements = {
              'Browse 1,000 products and shop selected products online.': 'Browse 300+ specialist products and shop selected products online.',
              '<b>1,000</b><span>Curated US product records</span>': '<b>300+</b><span>Specialist products across core departments</span>',
              '<span class="count">650 products</span>': '<span class="count">Deepest range</span>',
              '<span class="count">250 products</span>': '<span class="count">Specialist range</span>',
              '<span class="count">100 products</span>': '<span class="count">Curated range</span>',
          }
          for old, new in replacements.items():
              polished_home = polished_home.replace(old, new)
          if polished_home != home_text:
              home.write_text(polished_home, encoding='utf-8')
              changed += 1

          print(f'US shell attached/verified across {shell_count} pages')
          print(f'HTML files changed: {changed}')
          if 'assets/catalogue-premium.js' not in Path('us-catalogue.html').read_text(encoding='utf-8'):
              raise SystemExit('Catalogue premium runtime was not attached')
          if 'Browse 1,000 products' in Path('index.html').read_text(encoding='utf-8'):
              raise SystemExit('Homepage exact catalogue count is still exposed')
          if 'storefront-performance.js?v=3' not in Path('index.html').read_text(encoding='utf-8'):
              raise SystemExit('Homepage performance cache-bust missing')
          PY

      - name: Commit storefront shell updates
        run: |
          if git diff --quiet; then
            echo "No shell changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' assets/us-shell.js
          git commit -m "Refresh classic brand and performance runtime"
          git push origin HEAD:main
