name: Codex one-time main sync

on:
  push:
    branches: [main]
    paths:
      - ".codex-sync/**"
      - ".github/workflows/codex-main-sync.yml"

permissions:
  contents: write

jobs:
  apply-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply committed storefront state
        shell: bash
        run: |
          set -euo pipefail
          cat .codex-sync/chunk-* | base64 --decode > /tmp/omni-terrain-site.tar.gz
          tar -xzf /tmp/omni-terrain-site.tar.gz -C .
          git rm -r --ignore-unmatch .codex-sync .github/workflows/codex-main-sync.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply Omni Terrain storefront updates"
          git push origin HEAD:main
