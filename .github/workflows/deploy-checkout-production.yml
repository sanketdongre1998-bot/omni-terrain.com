name: Deploy checkout backend to Vercel production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "lib/**"
      - "assets/shield-products.js"
      - ".github/workflows/deploy-checkout-production.yml"

permissions:
  contents: read

concurrency:
  group: omni-terrain-checkout-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_euKBOwWNtTMSKSLBKlphq06m
      VERCEL_PROJECT_ID: prj_fk54pELaM6UYaQVHmClxZHmG91Ps
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Require Vercel deployment token
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN repository secret is required for production deployment."
            exit 1
          fi

      - name: Prepare isolated checkout backend
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_DIR="$RUNNER_TEMP/omni-terrain-checkout"
          rm -rf "$DEPLOY_DIR"
          mkdir -p "$DEPLOY_DIR/assets"
          cp -R api lib "$DEPLOY_DIR/"
          cp assets/shield-products.js "$DEPLOY_DIR/assets/shield-products.js"
          echo "DEPLOY_DIR=$DEPLOY_DIR" >> "$GITHUB_ENV"

      - name: Deploy production backend
        shell: bash
        run: >
          npx --yes vercel@latest deploy "$DEPLOY_DIR"
          --prod --yes
          --project "$VERCEL_PROJECT_ID"
          -T "$VERCEL_ORG_ID"
          --token "$VERCEL_TOKEN"

      - name: Verify production US checkout health
        shell: bash
        run: |
          set -euo pipefail
          # Ads launch gate: production must expose the current authorization-gated catalogue.
          for attempt in 1 2 3 4 5; do
            body="$(curl --fail --silent --show-error --max-time 30 https://omni-terrain-uk-checkout.vercel.app/api/us-checkout-health || true)"
            echo "$body"
            if echo "$body" | grep -q '"stripeConfigured":true' \
              && echo "$body" | grep -q '"checkoutMode":"authorization-gated"' \
              && echo "$body" | grep -Eq '"commerceReadyProducts":[1-9][0-9]*'; then
              exit 0
            fi
            sleep 8
          done
          echo "Production checkout health did not report an active authorization-gated catalogue."
          exit 1
