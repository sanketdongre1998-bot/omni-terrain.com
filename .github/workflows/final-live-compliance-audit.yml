name: Final live compliance audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-live-compliance-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify live UK pages
        shell: python
        run: |
          from pathlib import Path
          import urllib.request, time, re, html

          pages = sorted(p.name for p in Path('.').glob('*.html') if p.name == 'uk.html' or p.name.startswith('uk-') or p.name == 'shield-autocare-uk.html')
          company_no = '07981226'
          failures=[]
          checked=0
          vat_eori_hits=0
          vat_registered_hits=0
          company_rule_failures=0
          fetch_errors=0
          stamp=str(int(time.time()))
          vat_num=re.compile(r'VAT[^<\n]{0,40}\b\d{8,12}\b', re.I)
          eori_num=re.compile(r'EORI[^<\n]{0,40}\b[A-Z]{0,2}\s*\d{8,15}\b', re.I)

          for page in pages:
              url=f'https://omni-terrain.com/{page}?finalaudit={stamp}'
              try:
                  req=urllib.request.Request(url, headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      text=r.read().decode('utf-8','replace')
              except Exception as exc:
                  failures.append(f'{page}: FETCH {exc}')
                  fetch_errors += 1
                  continue

              checked += 1
              upper=text.upper()
              if 'EORI' in upper or '"VATID"' in upper or vat_num.search(text) or eori_num.search(text):
                  failures.append(f'{page}: VAT/EORI identifier-style exposure')
                  vat_eori_hits += 1
              if 'VAT REGISTERED' in upper:
                  failures.append(f'{page}: VAT registered phrase present')
                  vat_registered_hits += 1

              count=text.count(company_no)
              marker='class="legal-note" style="margin:10px auto 0;max-width:1180px;padding:0 20px;font-size:.56rem;line-height:1.45;opacity:.68"'
              footer_pos=text.find('<footer')
              num_pos=text.find(company_no)
              footer_end=text.find('</footer>')
              if count != 1 or marker not in text or footer_pos < 0 or num_pos < footer_pos or footer_end < num_pos:
                  failures.append(f'{page}: company number not limited to single compact legal footer (count={count})')
                  company_rule_failures += 1

          print(f'PAGES_DISCOVERED={len(pages)}')
          print(f'PAGES_FETCHED={checked}')
          print(f'FETCH_ERRORS={fetch_errors}')
          print(f'VAT_EORI_EXPOSURE_HITS={vat_eori_hits}')
          print(f'VAT_REGISTERED_HITS={vat_registered_hits}')
          print(f'COMPANY_NUMBER_RULE_FAILURES={company_rule_failures}')
          print('FINAL_STATUS=' + ('CLEAN' if not failures else 'FAIL'))
          if failures:
              print('\n'.join(failures))
              raise SystemExit(1)
