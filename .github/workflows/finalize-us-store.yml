name: Validate OMNI Terrain storefront

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "assets/**"
      - "scripts/**"
      - "sitemap.xml"
      - "robots.txt"
      - ".github/scripts/finalize_us_store.py"
      - ".github/workflows/finalize-us-store.yml"

permissions:
  contents: read

concurrency:
  group: validate-storefront-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate catalogues
        run: |
          node scripts/generate-us-catalogue.cjs
          node scripts/generate-shield-uk.cjs
          node scripts/generate-sitemap.cjs

      - name: Preserve hand-authored UK business and policy pages
        run: |
          git checkout -- \
            uk.html \
            uk-contact.html \
            uk-shipping-delivery-policy.html \
            uk-returns-refunds-policy.html \
            uk-privacy-policy.html \
            uk-terms-conditions.html

      - name: Confirm generated files are current
        run: git diff --exit-code

      - name: Validate catalogues, commerce and routes
        run: |
          node scripts/test-us-catalogue.cjs
          node scripts/test-shield-uk.cjs
          node scripts/test-commerce-runtime.cjs
          node scripts/test-http-routes.cjs
          node scripts/test-site-seo.cjs
          python .github/scripts/finalize_us_store.py
