name: Apply UK website-first storefront

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/finalize-us-store.yml"

permissions:
  contents: write

concurrency:
  group: apply-uk-website-first
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/ukpatch.xz.part* | base64 -d > /tmp/uk-patch.tar.xz
          xz -t /tmp/uk-patch.tar.xz
          tar -xJf /tmp/uk-patch.tar.xz
          rm -f .github/ukpatch.xz.part* .github/uk-patch.part00
          git checkout -- .github/workflows/finalize-us-store.yml

      - name: Validate website-first storefront
        run: |
          node scripts/test-us-catalogue.cjs
          node scripts/test-shield-uk.cjs
          node scripts/test-commerce-runtime.cjs
          node scripts/test-http-routes.cjs
          node scripts/test-site-seo.cjs
          python .github/scripts/finalize_us_store.py

      - name: Commit website-first storefront
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "Make UK storefront website-first"
          git push origin HEAD:main
