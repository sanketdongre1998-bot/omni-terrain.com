name: Fix homepage local image sources

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-homepage-local-images.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Point storefront at verified local homepage images
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          js_path = Path('assets/reference-storefront.js')
          js = js_path.read_text(encoding='utf-8')
          replacement = """const IMG = {
    hero: '/assets/ot-hero-auto-final.jpg?v=5',
    auto: '/assets/ot-cat-new-auto-final.jpg?v=5',
    used: '/assets/ot-cat-used-oem-v3.jpg?v=5',
    marine: '/assets/ot-cat-marine.webp?v=5',
    solar: '/assets/ot-cat-solar.webp?v=5',
    overland: '/assets/ot-cat-overland.webp?v=5',
    vehicle: '/assets/ot-cat-new-auto-final.jpg?v=5',
    deals: '/assets/ot-cat-deals.webp?v=5'
  };"""
          js2, n = re.subn(r"const IMG = \{.*?\n  \};", replacement, js, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Expected one IMG block, replaced {n}')
          js_path.write_text(js2, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          index = index.replace('/assets/reference-storefront.js?v=4', '/assets/reference-storefront.js?v=5')
          index_path.write_text(index, encoding='utf-8')
          PY
      - name: Commit source-of-truth image fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/reference-storefront.js index.html
          if git diff --cached --quiet; then
            echo 'No homepage image source changes required.'
          else
            git commit -m 'Use local homepage images in storefront source'
            git push origin HEAD:main
          fi
