name: Google Ads Pack Validation

on:
  push:
    paths:
      - 'marketing/**'
      - 'scripts/validate-google-ads-pack.py'
      - '.github/workflows/google-ads-pack-validation.yml'
      - 'assets/us-live-products.json'
      - 'assets/us-stock-status.json'
      - 'us-husky-towing-81147.html'
      - 'us-husky-towing-81148.html'
      - 'us-coast2coast-iwcn9010f.html'
      - 'us-coast2coast-iwcn8010f.html'
      - 'us-coast2coast-iwcimp103x.html'
      - 'us-air-lift-60828hd.html'
      - 'us-bilstein-24-066464.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-google-ads-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate paid-search launch pack and live product gate
        run: python scripts/validate-google-ads-pack.py
