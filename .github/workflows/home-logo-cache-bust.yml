name: One-time homepage logo cache bust

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/home-logo-cache-bust.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Force exact locked logo asset versions on homepage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          for version in range(1, 7):
              text = text.replace(f'assets/brand-speed.css?v={version}', 'assets/brand-speed.css?v=7')
          for version in range(1, 6):
              text = text.replace(f'assets/storefront-performance.js?v={version}', 'assets/storefront-performance.js?v=6')
          p.write_text(text, encoding='utf-8')
          assert 'assets/brand-speed.css?v=7' in text
          assert 'assets/storefront-performance.js?v=6' in text
          PY

      - name: Commit homepage cache bust
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo "Homepage already uses exact locked-logo asset versions."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Force exact locked logo assets on homepage"
          git push origin HEAD:main
