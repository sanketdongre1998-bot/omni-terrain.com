name: Restore visible Omni Terrain logo

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/home-logo-cache-bust.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-logo-sitewide:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore proven logo asset and bust caches
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/omni-terrain-logo-header.webp
          python3 - <<'PY'
          from pathlib import Path
          import re

          logo = '/assets/omni-terrain-logo-header.webp?v=3'
          css_version = '/assets/brand-speed.css?v=14'

          # Homepage: use the proven existing logo asset directly.
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          direct = '<a class="brand ot-logo-direct" href="index.html" aria-label="Omni Terrain home"><img class="ot-brand-logo-image" src="/assets/omni-terrain-logo-header.webp?v=3" alt="Omni Terrain" width="270" height="76" decoding="async" loading="eager" fetchpriority="high"></a>'
          pattern = re.compile(r'<a class="brand(?: ot-logo-direct)?" href="index\.html" aria-label="Omni Terrain home">.*?</a>', re.S)
          text, n = pattern.subn(direct, text, count=1)
          if n != 1:
              raise SystemExit(f'homepage brand replacement failed: matches={n}')
          p.write_text(text, encoding='utf-8')

          # Homepage runtime: same logo and fresh CSS.
          p = Path('assets/storefront-performance.js')
          text = p.read_text(encoding='utf-8')
          text = re.sub(r'const LOCKED_LOGO_SRC="[^"]+";', f'const LOCKED_LOGO_SRC="{logo}";', text)
          text = re.sub(r'/assets/brand-speed\.css\?v=\d+', css_version, text)
          text = re.sub(r'img\.width=\d+;', 'img.width=270;', text)
          text = re.sub(r'img\.height=\d+;', 'img.height=76;', text)
          p.write_text(text, encoding='utf-8')

          # Shared US shell: header/footer use the proven logo asset too.
          p = Path('assets/us-shell.js')
          text = p.read_text(encoding='utf-8')
          text = re.sub(r'src="/assets/omni-terrain-logo-[^"]+"', 'src="/assets/omni-terrain-logo-header.webp?v=3"', text)
          text = re.sub(r'width="\d+" height="\d+" decoding="async" loading="eager" fetchpriority="high"', 'width="270" height="76" decoding="async" loading="eager" fetchpriority="high"', text)
          text = re.sub(r'/assets/brand-speed\.css\?v=\d+', css_version, text)
          p.write_text(text, encoding='utf-8')

          # Every page gets fresh runtime/CSS URLs so stale blank-logo caches cannot win.
          for p in Path('.').glob('*.html'):
              text = p.read_text(encoding='utf-8')
              text = re.sub(r'(?<!/)assets/brand-speed\.css\?v=\d+', 'assets/brand-speed.css?v=14', text)
              text = re.sub(r'/assets/brand-speed\.css\?v=\d+', '/assets/brand-speed.css?v=14', text)
              text = re.sub(r'(?<!/)assets/storefront-performance\.js\?v=\d+', 'assets/storefront-performance.js?v=14', text)
              text = re.sub(r'/assets/storefront-performance\.js\?v=\d+', '/assets/storefront-performance.js?v=14', text)
              text = re.sub(r'(?<!/)assets/us-shell\.js\?v=\d+', 'assets/us-shell.js?v=14', text)
              text = re.sub(r'/assets/us-shell\.js\?v=\d+', '/assets/us-shell.js?v=14', text)
              p.write_text(text, encoding='utf-8')

          sf = Path('assets/storefront-performance.js').read_text(encoding='utf-8')
          us = Path('assets/us-shell.js').read_text(encoding='utf-8')
          home = Path('index.html').read_text(encoding='utf-8')
          css = Path('assets/brand-speed.css').read_text(encoding='utf-8')
          assert 'omni-terrain-logo-header.webp?v=3' in sf
          assert 'omni-terrain-logo-header.webp?v=3' in us
          assert 'omni-terrain-logo-header.webp?v=3' in home
          assert 'brand-speed.css?v=14' in sf
          assert 'brand-speed.css?v=14' in us
          assert 'brand-speed.css?v=14' in home
          assert 'storefront-performance.js?v=14' in home
          assert "background-image:url('/assets/omni-terrain-logo-header.webp?v=3')!important" in css
          PY

      - name: Commit visible logo restoration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Visible logo restoration already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/storefront-performance.js assets/us-shell.js '*.html'
          git commit -m "Restore visible Omni Terrain logo and compact header"
          git push origin HEAD:main
