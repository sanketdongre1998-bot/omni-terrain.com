name: Bust Omni Terrain logo assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/home-logo-cache-bust.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bust-logo-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Force fresh SVG-logo CSS and JS URLs sitewide
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          for p in Path('.').glob('*.html'):
              text = p.read_text(encoding='utf-8')
              text = re.sub(r'(?<!/)assets/brand-speed\.css\?v=\d+', 'assets/brand-speed.css?v=10', text)
              text = re.sub(r'/assets/brand-speed\.css\?v=\d+', '/assets/brand-speed.css?v=10', text)
              text = re.sub(r'(?<!/)assets/storefront-performance\.js\?v=\d+', 'assets/storefront-performance.js?v=10', text)
              text = re.sub(r'/assets/storefront-performance\.js\?v=\d+', '/assets/storefront-performance.js?v=10', text)
              text = re.sub(r'(?<!/)assets/us-shell\.js\?v=\d+', 'assets/us-shell.js?v=10', text)
              text = re.sub(r'/assets/us-shell\.js\?v=\d+', '/assets/us-shell.js?v=10', text)
              p.write_text(text, encoding='utf-8')

          # Ensure runtimes themselves cannot downgrade the CSS request.
          for name in ['assets/storefront-performance.js', 'assets/us-shell.js']:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              text = re.sub(r'/assets/brand-speed\.css\?v=\d+', '/assets/brand-speed.css?v=10', text)
              p.write_text(text, encoding='utf-8')

          # Guardrails: the broken WebP must not be the active logo source anymore.
          sf = Path('assets/storefront-performance.js').read_text(encoding='utf-8')
          us = Path('assets/us-shell.js').read_text(encoding='utf-8')
          css = Path('assets/brand-speed.css').read_text(encoding='utf-8')
          assert 'omni-terrain-logo-final.svg?v=10' in sf
          assert 'omni-terrain-logo-final.svg?v=10' in us
          assert 'omni-terrain-logo-final.svg?v=10' in css
          assert 'brand-speed.css?v=10' in sf
          assert 'brand-speed.css?v=10' in us
          PY

      - name: Commit fresh asset versions
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Logo assets already use v10."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/storefront-performance.js assets/us-shell.js '*.html'
          git commit -m "Force fresh SVG logo assets sitewide"
          git push origin HEAD:main
