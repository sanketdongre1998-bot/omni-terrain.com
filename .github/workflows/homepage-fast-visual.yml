name: Homepage Fast Visual Verification
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch homepage image source of truth
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          js_path = Path('assets/reference-storefront.js')
          js = js_path.read_text(encoding='utf-8')
          replacement = """const IMG = {
    hero: '/assets/ot-hero-auto-final.jpg?v=5',
    auto: '/assets/ot-cat-new-auto-final.jpg?v=5',
    used: '/assets/ot-cat-used-oem-v3.jpg?v=5',
    marine: '/assets/ot-cat-marine.webp?v=5',
    solar: '/assets/ot-cat-solar.webp?v=5',
    overland: '/assets/ot-cat-overland.webp?v=5',
    vehicle: '/assets/ot-cat-new-auto-final.jpg?v=5',
    deals: '/assets/ot-cat-deals.webp?v=5'
  };"""
          js2, n = re.subn(r"const IMG = \{.*?\n  \};", replacement, js, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Expected one IMG block, replaced {n}')
          js_path.write_text(js2, encoding='utf-8')
          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8').replace('/assets/reference-storefront.js?v=4','/assets/reference-storefront.js?v=5')
          index_path.write_text(index, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/reference-storefront.js index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Use local homepage images in storefront source'
            git push origin HEAD:main
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium
      - name: Verify US and UK retail homepages
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/omni-fast-http.log 2>&1 &
          sleep 1
          cat > homepage-fast.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const cases=[
            {region:'us',path:'index.html',active:'/'},
            {region:'uk',path:'uk.html',active:'/uk.html'}
          ];
          for(const [label,width,height] of [['desktop',1440,1000],['phone',390,844]]){
            for(const item of cases){
              const context=await browser.newContext({viewport:{width,height},colorScheme:'light'});
              const page=await context.newPage();
              const errors=[];
              page.on('pageerror',e=>errors.push(String(e.message||e)));
              await page.goto(`http://127.0.0.1:4173/${item.path}`,{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForTimeout(1600);
              const state=await page.evaluate(()=>{
                const visible=el=>{if(!el)return false;const s=getComputedStyle(el),r=el.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity||1)>0&&r.width>0&&r.height>0;};
                const headers=[...document.querySelectorAll('header')].filter(visible);
                const refHeaders=[...document.querySelectorAll('.ot-ref-header')].filter(visible);
                const active=[...document.querySelectorAll('.ot-ref-region a')].find(a=>visible(a)&&a.classList.contains('active'));
                const search=document.querySelector('.ot-ref-search input');
                const logo=document.querySelector('.ot-ref-logo img');
                const nav=document.querySelector('.ot-ref-nav');
                const hero=document.querySelector('.ot-ref-hero');
                const heroImg=document.querySelector('.ot-ref-hero-bg');
                const categoryImgs=[...document.querySelectorAll('.ot-ref-category img')];
                const cart=document.querySelector('.ot-ref-cart');
                const products=[...document.querySelectorAll('.ot-ref-product')].filter(visible).length;
                const mainText=(document.querySelector('main')?.innerText||'').replace(/\s+/g,' ').trim();
                const sameOriginBroken=[...document.images].filter(img=>{const src=String(img.currentSrc||img.getAttribute('src')||'');if(!src||!img.complete||img.naturalWidth>0||src.startsWith('data:')||src.startsWith('blob:'))return false;try{return new URL(src,location.href).origin===location.origin;}catch(_){return true;}}).map(img=>img.currentSrc||img.getAttribute('src')).slice(0,8);
                const topNav=[...document.querySelectorAll('.ot-ref-nav>.ot-ref-width>.ot-ref-nav-item,.ot-ref-nav>.ot-ref-width>a')].filter(visible).length;
                return {
                  bodyWidth:document.documentElement.scrollWidth,
                  viewport:innerWidth,
                  headers:headers.length,
                  refHeaders:refHeaders.length,
                  finder:/Find the Right Parts for Your Adventure/i.test(mainText),
                  search:Boolean(search&&visible(search)),
                  logo:logo?.getAttribute('src')||'',
                  activeHref:active?.getAttribute('href')||'',
                  products,
                  account:[...document.querySelectorAll('[data-ot-auth-trigger]')].filter(visible).length,
                  cart:Boolean(cart&&visible(cart)),
                  nav:Boolean(nav&&visible(nav)),
                  hero:Boolean(hero&&visible(hero)),
                  heroImage:{src:heroImg?.getAttribute('src')||'',naturalWidth:heroImg?.naturalWidth||0,naturalHeight:heroImg?.naturalHeight||0},
                  categoryImages:categoryImgs.map(img=>({src:img.getAttribute('src')||'',naturalWidth:img.naturalWidth||0,naturalHeight:img.naturalHeight||0})),
                  topNav,
                  sameOriginBroken
                };
              });
              console.log(JSON.stringify({label,region:item.region,state,errors}));
              await page.screenshot({path:`homepage-${item.region}-${label}.png`,fullPage:true});
              if(state.bodyWidth>state.viewport+2) throw new Error(`${item.region}/${label} horizontal overflow ${state.bodyWidth}>${state.viewport}`);
              if(state.headers!==1||state.refHeaders!==1) throw new Error(`${item.region}/${label} expected one reference header, got ${state.headers}/${state.refHeaders}`);
              if(!state.heroImage.src || state.heroImage.naturalWidth<1) throw new Error(`${item.region}/${label} hero image failed ${JSON.stringify(state.heroImage)}`);
              if(state.categoryImages.length<6 || state.categoryImages.some(x=>x.naturalWidth<1)) throw new Error(`${item.region}/${label} category image failed ${JSON.stringify(state.categoryImages)}`);
              if(!state.finder||!state.hero) throw new Error(`${item.region}/${label} approved home merchandising missing`);
              if(!state.search||!state.cart||!state.nav||state.account!==1) throw new Error(`${item.region}/${label} header controls incomplete ${JSON.stringify(state)}`);
              if(state.activeHref!==item.active) throw new Error(`${item.region}/${label} wrong active store ${state.activeHref}`);
              if(state.products<1) throw new Error(`${item.region}/${label} no visible product cards`);
              if(label==='phone'&&state.topNav!==4) throw new Error(`${item.region}/${label} expected 4 compact nav items, got ${state.topNav}`);
              if(state.sameOriginBroken.length) throw new Error(`${item.region}/${label} broken local images: ${state.sameOriginBroken.join(' | ')}`);
              if(errors.length) throw new Error(`${item.region}/${label} page errors: ${errors.join(' | ')}`);
              await context.close();
            }
          }
          await browser.close();
          EOF
          node homepage-fast.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-fast-visual
          path: homepage-*.png
          retention-days: 1
