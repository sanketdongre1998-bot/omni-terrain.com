name: Homepage Fast Visual Verification
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium
      - name: Verify US and UK retail homepages
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/omni-fast-http.log 2>&1 &
          sleep 1
          cat > homepage-fast.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const cases=[
            {region:'us',path:'index.html',hero:/find the right part/i,active:'/'},
            {region:'uk',path:'uk.html',hero:/uk auto, marine|find a uk product/i,active:'/uk.html'}
          ];
          for(const [label,width,height] of [['desktop',1440,1000],['phone',390,844]]){
            for(const item of cases){
              const context=await browser.newContext({viewport:{width,height},colorScheme:'light'});
              await context.addInitScript(()=>{try{localStorage.setItem('otRetailPromoSeen',String(Date.now()));}catch(_){}});
              const page=await context.newPage();
              const errors=[]; page.on('pageerror',e=>errors.push(String(e.message||e)));
              await page.goto(`http://127.0.0.1:4173/${item.path}`,{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForTimeout(1200);
              const state=await page.evaluate(()=>{
                const visible=el=>{if(!el)return false;const s=getComputedStyle(el),r=el.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0;};
                const headers=[...document.querySelectorAll('header')].filter(visible);
                const retailHeaders=[...document.querySelectorAll('.ot-retail-header')].filter(visible);
                const active=[...document.querySelectorAll('.ot-region-mini a')].find(a=>visible(a)&&(a.classList.contains('active')||a.getAttribute('aria-current')==='page'));
                const hero=(document.querySelector('.ot-retail-hero')?.innerText||'').replace(/\s+/g,' ').trim();
                const search=document.querySelector('.ot-retail-search input');
                const logo=document.querySelector('.ot-retail-logo img');
                const cards=[...document.querySelectorAll('.ot-retail-product')].filter(visible).length;
                return {
                  bodyWidth:document.documentElement.scrollWidth,
                  viewport:innerWidth,
                  headers:headers.length,
                  retailHeaders:retailHeaders.length,
                  hero,
                  search:Boolean(search&&visible(search)),
                  logo:logo?.getAttribute('src')||'',
                  activeHref:active?.getAttribute('href')||'',
                  cards,
                  account:[...document.querySelectorAll('[data-ot-auth-trigger]')].filter(visible).length,
                  cart:Boolean(document.querySelector('.ot-cart-button')&&visible(document.querySelector('.ot-cart-button'))),
                  nav:Boolean(document.querySelector('.ot-retail-nav')&&visible(document.querySelector('.ot-retail-nav'))),
                  welcomeVisible:Boolean(document.querySelector('.ot-welcome')&&visible(document.querySelector('.ot-welcome')))
                };
              });
              console.log(JSON.stringify({label,region:item.region,state,errors}));
              await page.screenshot({path:`homepage-${item.region}-${label}.png`,fullPage:true});
              if(state.bodyWidth>state.viewport+2) throw new Error(`${item.region}/${label} horizontal overflow ${state.bodyWidth}>${state.viewport}`);
              if(state.headers!==1||state.retailHeaders!==1) throw new Error(`${item.region}/${label} expected one retail header, got ${state.headers}/${state.retailHeaders}`);
              if(!state.logo.includes('omni-terrain-approved-gt.webp')) throw new Error(`${item.region}/${label} approved logo missing`);
              if(!item.hero.test(state.hero)) throw new Error(`${item.region}/${label} retail hero missing: ${state.hero}`);
              if(!state.search||!state.cart||!state.nav||state.account!==1) throw new Error(`${item.region}/${label} header controls incomplete ${JSON.stringify(state)}`);
              if(state.activeHref!==item.active) throw new Error(`${item.region}/${label} wrong active store ${state.activeHref}`);
              if(state.cards<1) throw new Error(`${item.region}/${label} no visible product cards`);
              if(state.welcomeVisible) throw new Error(`${item.region}/${label} suppressed welcome modal still visible`);
              if(errors.length) throw new Error(`${item.region}/${label} page errors: ${errors.join(' | ')}`);
              await context.close();
            }
          }
          await browser.close();
          EOF
          node homepage-fast.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-fast-visual
          path: homepage-*.png
          retention-days: 1
