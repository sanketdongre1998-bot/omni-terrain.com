name: Homepage polish final
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply homepage-only polish
        run: |
          python3 - <<'PY'
          from pathlib import Path

          locked = '/assets/omni-terrain-approved-gt.webp?v=1'
          index = Path('index.html').read_text(encoding='utf-8')
          if locked not in index:
              raise SystemExit('LOCKED LOGO REFERENCE MISSING — aborting')

          # Keep customer-facing homepage copy short and consistent with the approved mockup.
          p = Path('assets/customer-marketing-copy.js')
          s = p.read_text(encoding='utf-8')
          old = 'setText(".home-hero-copy p", "Shop automotive, towing, marine, RV and 12V parts by brand and manufacturer part number. Discover featured offers, fitment-focused product details and secure U.S. checkout.");'
          new = 'setText(".home-hero-copy p", "Specialist automotive, marine, RV & 12V parts.");'
          if old not in s:
              raise SystemExit('Expected customer hero copy not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # Homepage merchandising: four clean cards and a real Fabtech hero image instead of the Husky infographic.
          p = Path('assets/live-storefront-priority.js')
          s = p.read_text(encoding='utf-8')
          replacements = {
            'const featured=enabled.filter(x=>featuredIds.includes(x.id)).slice(0,7);if(!featured.length)return;':
              'const featured=enabled.filter(x=>featuredIds.includes(x.id)).slice(0,4);if(!featured.length)return;',
            'if(eyebrow)eyebrow.textContent="7 featured auto & truck offers";if(heading)heading.textContent="Upgrade today. Keep more in your pocket.";if(copy)copy.textContent="See your product price, featured shipping savings and today\'s delivered price before you buy.";':
              'if(eyebrow)eyebrow.textContent="Featured products";if(heading)heading.textContent="Popular upgrades.";if(copy)copy.textContent="Selected products with clear pricing and straightforward product details.";',
            'const heroCandidate=enabled.find(x=>x.id==="HUS81147")||featured[0];':
              'const heroCandidate=enabled.find(x=>x.id==="F37FTL5607")||featured[0];'
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit('Expected live storefront pattern not found: ' + old[:80])
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # Visual-only homepage layer: remove duplicate marketing banner and use a cleaner real 12V product image.
          p = Path('assets/homepage-refresh.css')
          s = p.read_text(encoding='utf-8')
          s = s.replace('BLU/Images/5026-BSS_4.jpg', 'BLU/Images/5026-BSS_1.jpg')
          guard = '\n/* Approved simplified homepage: duplicate runtime growth banner is intentionally hidden. */\n.ot-growth-banner{display:none!important}\n'
          if '.ot-growth-banner{display:none!important}' not in s:
              s += guard
          p.write_text(s, encoding='utf-8')

          # Confirm the strict logo lock was not touched.
          index_after = Path('index.html').read_text(encoding='utf-8')
          if locked not in index_after:
              raise SystemExit('LOCKED LOGO CHANGED — aborting')
          PY

          rm -f .github/workflows/homepage-polish-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/customer-marketing-copy.js assets/live-storefront-priority.js assets/homepage-refresh.css .github/workflows/homepage-polish-final.yml
          git commit -m 'Finalize simplified homepage hero and merchandising'
          git push
