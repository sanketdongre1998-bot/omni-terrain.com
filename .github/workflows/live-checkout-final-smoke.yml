name: Live Stripe checkout final smoke test

on:
  push:
    paths:
      - '.github/workflows/live-checkout-final-smoke.yml'

jobs:
  final-live-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live checkout session creation without payment
        shell: bash
        run: |
          set -euo pipefail

          health="$(curl --fail-with-body --silent --show-error 'https://omni-terrain-uk-checkout.vercel.app/api/health')"
          HEALTH="$health" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['HEALTH'])
          assert data.get('configured') is True, data
          assert data.get('mode') == 'live', data
          assert data.get('webhook_configured') is True, data
          assert data.get('shipping_profile') == 'shield_uk_mainland_free', data
          print('Live health configuration passed.')
          PY

          rejected_status="$(curl --silent --output /tmp/rejected.json --write-out '%{http_code}' \
            -X POST 'https://omni-terrain-uk-checkout.vercel.app/api/create-checkout-session' \
            -H 'Origin: https://omni-terrain.com' \
            -H 'Content-Type: application/json' \
            --data '{"items":[{"id":"cool-mate-70l-fridge-black","qty":1}]}')"

          if [ "$rejected_status" != "400" ]; then
            echo "Expected UK-mainland guard 400; got $rejected_status"
            cat /tmp/rejected.json
            exit 1
          fi

          response="$(curl --fail-with-body --silent --show-error \
            -X POST 'https://omni-terrain-uk-checkout.vercel.app/api/create-checkout-session' \
            -H 'Origin: https://omni-terrain.com' \
            -H 'Content-Type: application/json' \
            --data '{"delivery_region":"uk_mainland","items":[{"id":"cool-mate-70l-fridge-black","qty":1}]}')"

          session_id="$(RESPONSE="$response" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['RESPONSE'])
          session_id = str(data.get('id', ''))
          checkout_url = str(data.get('url', ''))
          assert session_id.startswith('cs_live_'), f'Expected live Checkout Session, got {session_id[:16]!r}'
          assert checkout_url.startswith('https://checkout.stripe.com/'), 'Missing Stripe Checkout URL'
          print(session_id)
          PY
          )"

          status="$(curl --fail-with-body --silent --show-error \
            -H 'Origin: https://omni-terrain.com' \
            "https://omni-terrain-uk-checkout.vercel.app/api/session-status?session_id=${session_id}")"

          STATUS="$status" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['STATUS'])
          assert data.get('paid') is False, 'Smoke-test session must remain unpaid'
          assert str(data.get('currency', '')).lower() == 'gbp', data
          assert int(data.get('amount_total') or 0) == 47995, data
          print('LIVE Stripe Checkout creation and trusted £479.95 total passed. No payment was made.')
          PY
