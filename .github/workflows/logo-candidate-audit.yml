name: Apply approved logo only
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply-logo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Swap only the Omni Terrain logo asset
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
            '/assets/omni-terrain-logo-transparent.webp?v=4':'/assets/omni-terrain-premium-logo.png?v=1',
            'assets/omni-terrain-logo-transparent.webp?v=4':'assets/omni-terrain-premium-logo.png?v=1',
            '/assets/omni-terrain-logo-crisp.svg?v=2':'/assets/omni-terrain-premium-logo.png?v=1',
            'assets/omni-terrain-logo-crisp.svg?v=2':'assets/omni-terrain-premium-logo.png?v=1',
          }
          changed=[]
          for p in list(Path('.').glob('*.html')) + list(Path('assets').glob('*.js')):
            try: s=p.read_text(encoding='utf-8')
            except Exception: continue
            old=s
            for a,b in replacements.items(): s=s.replace(a,b)
            if s!=old:
              p.write_text(s,encoding='utf-8')
              changed.append(str(p))
          print('logo-only changed:', changed)
          PY
          rm -f .github/workflows/logo-candidate-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use approved Omni Terrain premium logo' || exit 0
          git push
