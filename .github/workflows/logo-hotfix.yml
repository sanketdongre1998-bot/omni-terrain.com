name: One-shot approved logo hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-logo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace stale logo references and bust cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = list(Path('.').glob('*.html')) + list(Path('assets').glob('*.js'))
          changed = 0
          for p in candidates:
              try:
                  s = p.read_text(encoding='utf-8')
              except Exception:
                  continue
              old = s
              s = s.replace('/assets/omni-terrain-logo-crisp.svg?v=2', '/assets/omni-terrain-logo-transparent.webp?v=4')
              s = s.replace('assets/omni-terrain-logo-crisp.svg?v=2', 'assets/omni-terrain-logo-transparent.webp?v=4')
              s = re.sub(r'/assets/omni-terrain-logo-transparent\.webp\?v=\d+', '/assets/omni-terrain-logo-transparent.webp?v=4', s)
              s = re.sub(r'assets/omni-terrain-logo-transparent\.webp\?v=\d+', 'assets/omni-terrain-logo-transparent.webp?v=4', s)
              s = re.sub(r'brand-speed\.css\?v=\d+', 'brand-speed.css?v=16', s)
              s = re.sub(r'(<img\s+class="ot-brand-logo-image"[^>]*?)width="270"\s+height="75"', r'\1width="300" height="80"', s)
              if s != old:
                  p.write_text(s, encoding='utf-8')
                  changed += 1
          print(f'changed files: {changed}')
          PY

          echo 'Remaining stale US logo refs:'
          grep -R --include='*.html' --include='*.js' -n 'omni-terrain-logo-crisp.svg' . | head -20 || true
          if grep -R --include='*.html' --include='*.js' -q 'omni-terrain-logo-crisp.svg' .; then
            echo 'ERROR: stale crisp logo references remain'
            exit 1
          fi

          rm -f .github/workflows/logo-hotfix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'Use approved Omni Terrain logo sitewide'
          git push
