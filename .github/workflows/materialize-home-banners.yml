name: Materialize homepage commercial banners

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-home-banners.yml'
      - 'assets/ot-home-commercial-sprite.webp'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Crop banner assets
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          src = Image.open('assets/ot-home-commercial-sprite.webp').convert('RGB')
          crops = {
              'ot-home-hero-commercial.webp': (0, 0, 900, 300),
              'ot-home-new-auto-commercial.webp': (0, 300, 500, 500),
              'ot-home-used-oem-commercial.webp': (0, 500, 500, 700),
              'ot-home-marine-commercial.webp': (0, 700, 500, 900),
              'ot-home-solar-commercial.webp': (0, 900, 500, 1100),
              'ot-home-overland-commercial.webp': (0, 1100, 500, 1300),
              'ot-home-deals-commercial.webp': (0, 1300, 500, 1500),
          }
          out = Path('assets')
          for name, box in crops.items():
              src.crop(box).save(out / name, 'WEBP', quality=90, method=6)
          PY
      - name: Commit generated banner assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/ot-home-*-commercial.webp
          if git diff --cached --quiet; then
            echo 'No banner asset changes.'
          else
            git commit -m 'Materialize homepage commercial banner assets'
            git push origin HEAD:main
          fi
