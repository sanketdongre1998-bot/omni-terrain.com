name: One-time investor source polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-investor-source-polish.yml'

permissions:
  contents: write

jobs:
  polish-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply source-level storefront polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, pairs):
              p = Path(path)
              text = p.read_text()
              changed = False
              for old, new in pairs:
                  if old in text:
                      text = text.replace(old, new)
                      changed = True
              if changed:
                  p.write_text(text)
              print(f'{path}: {"updated" if changed else "no change"}')

          patch('index.html', [
              ('Shop automotive, towing, marine and RV parts across the United States. Find products by brand and MPN, get fitment help, featured savings and secure U.S. checkout.',
               'Shop automotive, towing, marine and RV parts across the United States. Search by brand and MPN, get fitment help, live availability and secure U.S. checkout.'),
              ('"name":"PRP Xpert LLC","alternateName":"Omni Terrain"',
               '"name":"Omni Terrain","alternateName":"Road / Water / Power"'),
              (',"address":{"@type":"PostalAddress","streetAddress":"30 N Gould St Ste R","addressLocality":"Sheridan","addressRegion":"WY","postalCode":"82801","addressCountry":"US"}', ''),
              ('Shop trusted automotive, towing, marine, RV and 12V parts by brand or manufacturer part number. Compare featured deals, get fitment help and check out securely online.',
               'Specialist parts for trucks, boats, RVs and 12V systems — clear MPNs, fitment guidance, live availability and secure U.S. checkout.'),
              ('<b>300+</b><span>Automotive, marine and RV products</span>',
               '<b>1,000</b><span>Specialist products across Auto Parts, Marine and RV</span>'),
              ('<h2>Find the right part faster.</h2>', '<h2>Shop by application.</h2>'),
              ('Browse truck, towing and suspension parts, marine electrical and navigation equipment, plus RV and overlanding essentials.',
               'Start with the vehicle, vessel or system you are working on, then narrow by brand and MPN.'),
              ('<h2>Upgrade today. Keep more in your pocket.</h2>', '<h2>Selected upgrades. Clear pricing.</h2>'),
              ('See your product price, featured shipping savings and today\'s delivered price before you buy.',
               'Selected products with straightforward pricing, product detail and support before checkout.'),
              ('<p class="legal-note"><strong>US operator:</strong> PRP Xpert LLC · 30 N Gould St Ste R, Sheridan, WY 82801 · procurement@omni-terrain.com</p>',
               '<p class="legal-note"><strong>Omni Terrain US</strong> · Product support +1 307-533-0570 · procurement@omni-terrain.com</p>'),
          ])

          patch('checkout.html', [
              ('<span class="status-chip">Checkout eligibility check</span><span>Selected products are checked against the live catalogue before the next checkout step is shown.</span>',
               '<span class="status-chip">Live availability</span><span>Selected products are verified against the live catalogue before payment.</span>'),
              ('We’re checking selected products and preparing the correct next step. Eligible items continue to secure payment; items requiring review will show that workflow clearly.',
               'Enter your delivery details to confirm product availability and continue securely. If a product needs fitment or stock review, we will show that before payment.'),
              ('>Continue</button>', '>Continue securely</button>'),
              ('Eligible products continue through secure checkout. If review is required, Omni Terrain will show that before any payment step.',
               'Eligible products continue to secure payment. If an item needs review, we will show that clearly before any payment step.'),
              ('<strong>US operator:</strong> PRP Xpert LLC · Wyoming, United States · procurement@omni-terrain.com',
               '<strong>Omni Terrain US</strong> · Product support +1 307-533-0570 · procurement@omni-terrain.com'),
              ('>Request cart</a>', '>Cart</a>'),
          ])

          patch('contact-and-order-help.html', [
              ('Guest checkout — no account required.', 'Account optional · Secure online checkout · Product support available.'),
              ('Request Cart ', 'Cart '),
              ('>Request Cart</a>', '>Cart</a>'),
              ('>Guest Checkout</a>', '>Checkout</a>'),
              ('Contact Omni Terrain before submitting a request, while confirming commercial terms, or after an accepted order. Do not send card numbers, passwords or bank credentials by email.',
               'Get product, fitment, checkout or order support from the Omni Terrain team. Never send card numbers, passwords or bank credentials by email.'),
              ('>Open request cart</a>', '>Open cart</a>'),
              ('Product details and an order-request reference help the team respond faster.',
               'Product details and an order reference help the team respond faster.'),
              ('<div class="address-card"><strong>US operator:</strong><br>PRP Xpert LLC<br>30 N Gould St Ste R<br>Sheridan, WY 82801<br>United States</div>',
               '<div class="address-card"><strong>Omni Terrain U.S. support</strong><br>Product &amp; fitment help: support@omni-terrain.com<br>Orders &amp; procurement: procurement@omni-terrain.com<br>Phone: +1 307-533-0570</div>'),
              ('Order-request reference (optional)', 'Order reference (optional)'),
              ('01 / BEFORE REQUEST', '01 / BEFORE ORDER'),
              ('03 / AFTER ACCEPTANCE', '03 / AFTER PURCHASE'),
              ('United States product, request-checkout and supplier support for automotive, RV and marine categories.',
               'United States product, checkout and supplier support for automotive, RV and marine categories.'),
              ('<strong>US operator:</strong> PRP Xpert LLC · 30 N Gould St Ste R, Sheridan, WY 82801 · procurement@omni-terrain.com',
               '<strong>Omni Terrain US</strong> · Product support +1 307-533-0570 · procurement@omni-terrain.com'),
              ('Guest request checkout · No card details by email', 'Product support · Secure online checkout'),
          ])

          patch('about-omni-terrain.html', [
              ('Omni Terrain is being built for people who want to understand gear before they buy it. We focus on practical automotive, marine, RV and solar products—and we explain the important parts in a way that feels clear, useful and human.',
               'Omni Terrain is a specialist store for automotive, marine, RV and 12V products, built around clear product information, practical buying guidance and support before and after purchase.'),
          ])
          PY

      - name: Commit source polish
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'omni-terrain-store-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html checkout.html contact-and-order-help.html about-omni-terrain.html
          git commit -m 'Polish investor-facing storefront source copy'
          git push origin HEAD:main
