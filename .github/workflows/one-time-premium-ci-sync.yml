name: One-time premium CI sync

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align fallback copy with premium storefront
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          old = '<b>1,000</b><span>Specialist products across Auto Parts, Marine and RV</span>'
          new = '<b>1,000</b><span>Automotive, marine and RV products across focused specialist categories</span>'
          if old in text:
              text = text.replace(old, new, 1)
          index.write_text(text, encoding='utf-8')

          customer = Path('assets/customer-marketing-copy.js')
          text = customer.read_text(encoding='utf-8')
          marker = "  const CUSTOMER_TRUST_COPY = 'Shop with confidence.';\n"
          anchor = "  window.__OMNI_INVESTOR_POLISH__ = true;\n"
          if marker not in text and anchor in text:
              text = text.replace(anchor, anchor + marker, 1)
          customer.write_text(text, encoding='utf-8')
          PY
      - name: Commit aligned source
        run: |
          git config user.name "omni-terrain-store-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html assets/customer-marketing-copy.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Align premium storefront fallback copy"
          git push origin HEAD:main
