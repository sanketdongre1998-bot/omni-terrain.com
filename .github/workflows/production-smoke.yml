name: Production storefront smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "assets/**"
      - "lib/**"
      - "scripts/test-production-smoke.py"
      - ".github/workflows/production-smoke.yml"

permissions:
  contents: read

concurrency:
  group: production-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out storefront
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run customer-facing production smoke checks
        run: python scripts/test-production-smoke.py
