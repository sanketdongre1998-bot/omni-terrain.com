name: Remove VAT registered label

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-vat-registered-label.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove nonessential VAT registration label
        shell: python
        run: |
          from pathlib import Path
          changed=[]
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts:
                  continue
              t=p.read_text(encoding='utf-8')
              n=t.replace(' · VAT registered','').replace('VAT registered · ','')
              if n!=t:
                  p.write_text(n,encoding='utf-8')
                  changed.append(str(p))
          print('\n'.join(changed))
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove nonessential VAT registered label from UK pages'
          git push origin HEAD:main
