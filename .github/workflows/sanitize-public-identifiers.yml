name: Sanitize public business identifiers

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sanitize-public-identifiers.yml

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove exact public identifiers
        shell: python
        run: |
          from pathlib import Path

          extensions = {'.html', '.htm', '.js', '.mjs', '.json', '.py'}
          replacements = [
              (' · VAT GB 433306133 · EORI GB433306133000', ''),
              (' · VAT GB 433306133', ''),
              (' · EORI GB433306133000', ''),
              ('VAT: GB 433306133<br>EORI: GB433306133000<br>', ''),
              ('VAT: GB 433306133<br>', ''),
              ('EORI: GB433306133000<br>', ''),
              (', VAT GB 433306133,', ','),
              (', VAT GB 433306133', ''),
              ('VAT: GB 433306133', ''),
              ('EORI: GB433306133000', ''),
              ('VAT GB 433306133', ''),
              ('EORI GB433306133000', ''),
          ]

          changed = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in extensions:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print(f'Changed {len(changed)} files')
          for path in changed:
              print(path)

          remaining = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in extensions:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if 'GB 433306133' in text or 'GB433306133000' in text:
                  remaining.append(str(path))

          if remaining:
              raise SystemExit('Identifiers still present in: ' + ', '.join(remaining))

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No additional identifiers found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove public VAT and EORI identifiers site-wide"
          git push origin HEAD:main
