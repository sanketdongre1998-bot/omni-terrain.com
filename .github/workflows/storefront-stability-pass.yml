name: One-time storefront stability pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/storefront-stability-pass.yml'

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic storefront fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          # 1) US shell owns its CSS stack and mounts immediately when loaded at body end.
          shell_path = root / 'assets' / 'us-shell.js'
          shell = shell_path.read_text(encoding='utf-8')
          pattern = re.compile(r'  function injectCss\(\) \{.*?  function injectStockStatusAssets\(\) \{', re.S)
          replacement = '''  function ensureStyle(selector, href, dataKey) {
            const existing = document.querySelector(selector);
            if (existing) {
              if (existing.tagName === "LINK" && existing.getAttribute("href") !== href) existing.setAttribute("href", href);
              return existing;
            }
            const link = document.createElement("link");
            link.rel = "stylesheet";
            link.href = href;
            if (dataKey) link.dataset[dataKey] = "true";
            document.head.appendChild(link);
            return link;
          }

          function injectCss() {
            ensureStyle('link[href*="storefront-performance.css"]', "/assets/storefront-performance.css", "otStorefrontPerformance");
            ensureStyle('link[href*="us-shell.css"]', "/assets/us-shell.css?v=4", "otUsShell");
            ensureStyle('link[data-ot-image-layout-fix],link[data-ot-image-layout],link[href*="image-layout-fix.css"]', "/assets/image-layout-fix.css?v=2", "otImageLayoutFix");
            ensureStyle('link[data-ot-responsive-hardening],link[href*="responsive-hardening.css"]', "/assets/responsive-hardening.css?v=4", "otResponsiveHardening");
            ensureStyle('link[data-ot-brand-speed],link[href*="brand-speed.css"]', "/assets/brand-speed.css?v=6", "otBrandSpeed");
          }

          function injectStockStatusAssets() {'''
          shell2, n = pattern.subn(replacement, shell, count=1)
          if n != 1:
            raise SystemExit('Could not replace shell CSS loader block')
          shell2 = shell2.replace('    injectImageLayoutFix();\n', '')
          old_mount = '  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount, { once: true });\n  else mount();'
          new_mount = '  if (document.body) mount();\n  else document.addEventListener("DOMContentLoaded", mount, { once: true });'
          if old_mount not in shell2:
            raise SystemExit('Could not replace shell mount timing')
          shell2 = shell2.replace(old_mount, new_mount, 1)
          shell_path.write_text(shell2, encoding='utf-8')

          # 2) Cache-bust the central runtime on every US HTML page and set theme before paint.
          bootstrap = "<script data-ot-theme-bootstrap>try{const t=localStorage.getItem('omni-theme');document.documentElement.dataset.theme=t==='light'?'light':'dark'}catch(_){document.documentElement.dataset.theme='dark'}</script>"
          for page in root.glob('*.html'):
            text = page.read_text(encoding='utf-8')
            if 'lang="en-US"' not in text:
              continue
            changed = text
            changed = changed.replace('assets/storefront-performance.js?v=3', 'assets/storefront-performance.js?v=5')
            changed = changed.replace('assets/storefront-performance.js?v=4', 'assets/storefront-performance.js?v=5')
            changed = changed.replace('assets/us-shell.js?v=5', 'assets/us-shell.js?v=6')
            changed = changed.replace('assets/brand-speed.css?v=4', 'assets/brand-speed.css?v=6')
            changed = changed.replace('assets/brand-speed.css?v=5', 'assets/brand-speed.css?v=6')
            if 'theme-toggle.js' in changed and 'data-ot-theme-bootstrap' not in changed:
              changed, count = re.subn(r'(<meta charset="utf-8">)', r'\1' + bootstrap, changed, count=1)
              if count != 1:
                raise SystemExit(f'Could not add theme bootstrap to {page}')
            if page.name == 'index.html':
              old = '<link rel="stylesheet" href="assets/storefront-performance.css"><link rel="stylesheet" href="assets/brand-speed.css?v=6">'
              new = '<link rel="stylesheet" href="assets/storefront-performance.css"><link rel="stylesheet" href="assets/image-layout-fix.css?v=2"><link rel="stylesheet" href="assets/responsive-hardening.css?v=4"><link rel="stylesheet" href="assets/brand-speed.css?v=6">'
              if old in changed:
                changed = changed.replace(old, new, 1)
            if changed != text:
              page.write_text(changed, encoding='utf-8')

          # 3) Remove the misleading legacy request-state flash on Cart.
          cart_path = root / 'cart.html'
          cart = cart_path.read_text(encoding='utf-8')
          cart_replacements = {
            'Omni Terrain US request cart for automotive, RV and marine products.': 'Omni Terrain US cart for checkout-ready products and product review where required.',
            '<title>Request Cart | Omni Terrain</title>': '<title>Cart | Omni Terrain</title>',
            '>Request Cart <span class="cart-count"': '>Cart <span class="cart-count"',
            '<a href="cart.html">Request Cart</a>': '<a href="cart.html">Cart</a>',
            '<span class="status-chip">Order review workflow</span><span>Add relevant products to the request cart. Availability, price, shipping and return terms are confirmed before payment.</span>': '<span class="status-chip">Secure US checkout</span><span>Eligible products can continue to secure checkout. Items requiring review will show the appropriate next step.</span>',
            '<span class="eyebrow" style="color:var(--gold2)">Your product request</span><h1>Request cart</h1><p>Review selected products and continue to checkout. A request is not a paid order and does not reserve inventory.</p>': '<span class="eyebrow" style="color:var(--gold2)">Your cart</span><h1>Shopping cart</h1><p>Review selected products. Checkout-ready items can continue to secure payment; items requiring review will show the appropriate next step.</p>',
            '<h2>Request summary</h2>': '<h2>Cart summary</h2>',
            '<div class="summary-row"><span>Price</span><strong>Confirmed after review</strong></div>': '<div class="summary-row"><span>Price</span><strong>Shown for eligible items</strong></div>',
            '<div class="summary-row"><span>Shipping</span><strong>Confirmed by destination</strong></div>': '<div class="summary-row"><span>Shipping</span><strong>Shown at checkout or confirmed</strong></div>',
            '<div class="summary-row"><span>Payment</span><strong>Secure invoice after acceptance</strong></div>': '<div class="summary-row"><span>Payment</span><strong>Secure checkout for eligible items</strong></div>',
            '<div class="checkout-note">No card details are collected on this page. Continue to checkout to provide customer and delivery information for availability review.</div>': '<div class="checkout-note">Checkout availability is verified against the live product registry before any payment step.</div>',
            'US Store · Product availability confirmed before payment': 'US Store · Secure checkout for eligible products',
            '>Request cart</a>': '>Cart</a>',
          }
          for old, new in cart_replacements.items():
            cart = cart.replace(old, new)
          cart_path.write_text(cart, encoding='utf-8')

          # 4) Make Checkout neutral while the live bridge resolves the correct flow.
          checkout_path = root / 'checkout.html'
          checkout = checkout_path.read_text(encoding='utf-8')
          checkout_replacements = {
            'Omni Terrain US checkout for product availability, shipping and commercial review.': 'Secure Omni Terrain US checkout for eligible products, with review shown only where required.',
            '>Request Cart <span class="cart-count"': '>Cart <span class="cart-count"',
            '<a href="cart.html">Request Cart</a>': '<a href="cart.html">Cart</a>',
            '<span class="status-chip">Manual review checkout</span><span>Submit customer and delivery details. Payment is requested only after product availability and final terms are confirmed.</span>': '<span class="status-chip">Checkout eligibility check</span><span>Selected products are checked against the live catalogue before the next checkout step is shown.</span>',
            '<span class="eyebrow" style="color:var(--gold2)">Checkout</span><h1>Order request checkout</h1><p>This checkout collects the details needed to verify products, shipping and commercial terms. It does not collect card information or charge the customer.</p>': '<span class="eyebrow" style="color:var(--gold2)">Checkout</span><h1>Secure checkout</h1><p>We’re checking selected products and preparing the correct next step. Eligible items continue to secure payment; items requiring review will show that workflow clearly.</p>',
            'I understand this is an order request, not an immediate charge or stock reservation.': 'I understand product availability and checkout eligibility are verified before the order is finalized.',
            '>Submit order request</button>': '>Continue</button>',
            '<h2>Order review</h2>': '<h2>Order summary</h2>',
            '<div class="checkout-note">After review, Omni Terrain will confirm availability, price, shipping, tax where applicable, returns and a secure payment method. Card details are never requested by email.</div>': '<div class="checkout-note">Eligible products continue through secure checkout. If review is required, Omni Terrain will show that before any payment step.</div>',
            'US Store · Product availability confirmed before payment': 'US Store · Secure checkout for eligible products',
          }
          for old, new in checkout_replacements.items():
            checkout = checkout.replace(old, new)
          checkout_path.write_text(checkout, encoding='utf-8')
          PY

      - name: Commit stability pass
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/us-shell.js '*.html'
          git commit -m "Stabilize US storefront rendering"
          git push
