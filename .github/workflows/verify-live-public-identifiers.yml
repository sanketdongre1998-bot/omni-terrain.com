name: Verify live public identifiers are removed

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-live-public-identifiers.yml

permissions:
  contents: write

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check live public pages
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import URLError, HTTPError
          import time
          from datetime import datetime, timezone

          base = 'https://omni-terrain.com/'
          pages = [
              'uk.html',
              'uk-contact.html',
              'uk-cart.html',
              'shield-autocare-uk.html',
              'uk-shipping-delivery-policy.html',
              'uk-returns-refunds-policy.html',
              'uk-privacy-policy.html',
              'uk-terms-conditions.html',
              'uk-cool-mate-70l-fridge-black.html',
              'uk-cool-mate-70l-fridge-silver.html',
              'uk-shield-frameless-window-500x300.html',
              'uk-shield-frameless-window-500x450.html',
              'uk-shield-frameless-window-700x500.html',
              'uk-shield-frameless-window-700x550.html',
              'uk-shield-frameless-window-720x360.html',
              'uk-shield-frameless-window-900x500.html',
              'uk-shield-cassette-blind-1000x800-white.html',
              'uk-shield-cassette-blind-1000x800-black.html',
              'uk-shield-cassette-blind-1000x800-beige.html',
              'uk-shield-cassette-blind-1100x450-white.html',
              'uk-shield-cassette-blind-1100x450-black.html',
              'uk-shield-cassette-blind-1100x450-beige.html',
              'uk-shield-cassette-blind-1100x550-black.html',
              'uk-shield-cassette-blind-1100x550-beige.html',
              'uk-shield-cassette-blind-1200x500-white.html',
              'uk-shield-cassette-blind-1200x500-black.html',
              'uk-shield-cassette-blind-1200x500-beige.html',
              'uk-shield-cassette-blind-1450x550-white.html',
          ]
          forbidden = ('GB 433306133', 'GB433306133000')
          final_dirty = []
          final_errors = []

          for attempt in range(1, 7):
              dirty = []
              errors = []
              for page in pages:
                  url = f'{base}{page}?privacy_check={int(time.time())}'
                  req = Request(url, headers={'User-Agent': 'OmniTerrain-Live-Privacy-Check/1.0', 'Cache-Control': 'no-cache'})
                  try:
                      with urlopen(req, timeout=25) as response:
                          text = response.read().decode('utf-8', errors='replace')
                  except (URLError, HTTPError, TimeoutError) as exc:
                      errors.append(f'{page}: {type(exc).__name__}')
                      continue
                  if any(token in text for token in forbidden):
                      dirty.append(page)

              final_dirty, final_errors = dirty, errors
              if not dirty and not errors:
                  break
              if attempt < 6:
                  time.sleep(10)

          status = 'CLEAN' if not final_dirty and not final_errors else 'NOT_CLEAN'
          report = [
              f'Status: {status}',
              f'Checked at: {datetime.now(timezone.utc).isoformat()}',
              f'Pages checked: {len(pages)}',
              f'Pages still exposing exact identifiers: {len(final_dirty)}',
              f'Fetch errors: {len(final_errors)}',
          ]
          if final_dirty:
              report.append('Dirty pages: ' + ', '.join(final_dirty))
          if final_errors:
              report.append('Fetch errors: ' + '; '.join(final_errors))
          Path('LIVE-IDENTIFIER-CHECK.txt').write_text('\n'.join(report) + '\n', encoding='utf-8')
          print('\n'.join(report))

      - name: Commit verification report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LIVE-IDENTIFIER-CHECK.txt
          git commit -m "Record live identifier verification result"
          git push origin HEAD:main
