<body>
  <img hidden src="/assets/omni-terrain-approved-gt.webp?v=1" alt="">
  <main id="otHomeShell">
    <section class="ot-home-fallback" aria-label="Omni Terrain US">
      <div><h1>Omni Terrain</h1><p>New and selected used OEM automotive parts, marine, RV and 12V gear for the United States. Shop featured offers or search by brand and manufacturer part number.</p></div>
    </section>
  </main>
  <script id="otReferenceStorefrontJs" defer src="/assets/reference-storefront.js?v=4"></script>
  <script id="otReferenceStorefrontFidelityJs" defer src="/assets/reference-storefront-fidelity.js?v=2"></script>
  <script>
    (() => {
      const commercialImages = [
        ['/assets/ot-cat-new-auto-final.jpg?v=4','New automotive parts and service essentials'],
        ['/assets/ot-cat-used-oem-v3.jpg?v=4','Used OEM automotive components'],
        ['/assets/ot-cat-marine.webp?v=4','Marine equipment and accessories'],
        ['/assets/ot-cat-solar.webp?v=4','Solar and 12V power equipment'],
        ['/assets/ot-cat-overland.webp?v=4','Overlanding and outdoor vehicle gear'],
        ['/assets/ot-cat-deals.webp?v=4','Featured automotive and outdoor gear']
      ];

      const applyCommercialImages = () => {
        const hero = document.querySelector('.ot-ref-hero-bg');
        if (hero) {
          hero.src = '/assets/omni-home-hero-final.webp?v=1';
          hero.alt = 'Omni Terrain parts for every journey — auto, marine, power and outdoors';
          hero.loading = 'eager';
          hero.fetchPriority = 'high';
          hero.decoding = 'async';
          hero.style.backgroundImage = 'none';
          hero.style.filter = 'none';
          hero.style.objectFit = 'cover';
          hero.style.objectPosition = window.matchMedia('(max-width:760px)').matches ? 'left center' : 'center';
        }
        document.querySelectorAll('.ot-ref-category img').forEach((img,index) => {
          const item = commercialImages[index];
          if (!item) return;
          img.src = item[0];
          img.alt = item[1];
          img.loading = 'lazy';
          img.decoding = 'async';
          img.style.backgroundImage = 'none';
          img.style.filter = 'none';
          img.style.objectFit = 'cover';
          img.style.objectPosition = 'center';
        });
      };

      const applySalesFirst = () => {
        if (!document.documentElement.classList.contains('ot-reference-home')) return false;

        applyCommercialImages();

        const utilityCenter = document.querySelector('.ot-ref-utility-center');
        if (utilityCenter) utilityCenter.textContent = 'Opening Offers · Omni Terrain US';

        const slogan = document.querySelector('.ot-ref-hero-slogan');
        if (slogan) slogan.style.display = 'none';
        const heroCopy = document.querySelector('.ot-ref-hero-copy');
        if (heroCopy) heroCopy.style.display = 'none';

        const iconbar = document.querySelector('.ot-ref-iconbar');
        if (iconbar && !document.querySelector('.ot-home-launch-offer')) {
          const offer = document.createElement('section');
          offer.className = 'ot-home-launch-offer';
          offer.setAttribute('aria-label', 'Omni Terrain launch offer');
          offer.innerHTML = '<div class="ot-ref-width"><div class="ot-home-launch-offer-inner"><div class="ot-home-launch-copy"><span class="ot-home-launch-kicker">LAUNCH OFFER · US STORE</span><strong>Save $5 on eligible regular-priced orders of $150+</strong><p>Use code <code>OMNI5</code> at checkout. Featured-offer items are excluded from OMNI5 because they already use featured pricing.</p></div><a href="/deals.html">Shop Featured Deals →</a></div></div>';
          iconbar.insertAdjacentElement('afterend', offer);
        }

        const featuredHeading = document.querySelector('#otRefProductsSection .ot-ref-section-head h2');
        if (featuredHeading) featuredHeading.textContent = 'Featured Deals & Best Picks';
        const featuredLink = document.querySelector('#otRefProductsSection .ot-ref-section-head a');
        if (featuredLink) { featuredLink.href = '/deals.html'; featuredLink.textContent = 'Shop All Deals →'; }

        return !!document.querySelector('.ot-ref-main');
      };

      const run = () => { [0, 100, 250, 600, 1200, 2500].forEach(ms => setTimeout(applySalesFirst, ms)); };
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run, { once:true });
      else run();
      window.addEventListener('load', applySalesFirst, { once:true });
    })();
  </script>
  <script defer src="/assets/storefront-performance.js?v=17"></script>
</body>
</html>
